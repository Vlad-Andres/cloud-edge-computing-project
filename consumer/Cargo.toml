[package]
name = "consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
apache-avro = "0.22"
clap = { version = "4", features = ["derive", "env"] }
postgres = "0.19"
prometheus = "0.13"
rdkafka = { version = "0.39", features = ["cmake-build", "ssl"] }
serde = { version = "1", features = ["derive"] }
tiny_http = "0.12"
ureq = { version = "3", features = ["json"] }
