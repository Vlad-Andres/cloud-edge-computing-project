[package]
name = "consumer"
version = "0.1.0"
edition = "2024"

[dependencies]
apache-avro = "0.22"
clap = { version = "4", features = ["derive", "env"] }
rdkafka = { version = "0.39", features = ["cmake-build", "ssl"] }
serde = { version = "1", features = ["derive"] }
ureq = { version = "3", features = ["json"] }
