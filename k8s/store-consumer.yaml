apiVersion: apps/v1
kind: Deployment
metadata:
  name: store-consumer
  labels:
    app: store-consumer
spec:
  # No replicas: KEDA sets the count 
  selector:
    matchLabels:
      app: store-consumer
  template:
    metadata:
      labels:
        app: store-consumer
    spec:
      enableServiceLinks: false
      shareProcessNamespace: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          matchLabelKeys: [pod-template-hash]
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: store-consumer
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["sh", "-c", "until pg_isready -h postgres -p 5432; do sleep 2; done"]
      containers:
        - name: store-consumer
          image: store-consumer
          args: ["experiment", "group16-k8s-store"]
          envFrom:
            - secretRef:
                name: app-env
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
          ports:
            - name: metrics
              containerPort: 9091
          volumeMounts:
            - name: kafka-auth
              mountPath: /usr/src/app/auth
              readOnly: true
      volumes:
        - name: kafka-auth
          secret:
            secretName: kafka-auth
