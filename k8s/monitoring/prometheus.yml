global:
  scrape_interval: 5s

scrape_configs:
  # Every consumer pod is scraped on its own. job = the pod's app label, so the
  # dashboard queries (sum by (job)) add up all replicas like before.
  - job_name: consumers
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [cec]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: store-consumer|notify-consumer
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
