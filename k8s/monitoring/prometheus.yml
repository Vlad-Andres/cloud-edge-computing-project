global:
  scrape_interval: 5s

scrape_configs:
  - job_name: consumers
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [cec]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: store-consumer|notify-consumer
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_label_app]
        target_label: job
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: instance


  - job_name: rest-api
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [cec]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: rest-api
        action: keep
      - source_labels: [__meta_kubernetes_pod_container_port_name]
        regex: http|metrics
        action: keep
      - source_labels: [__meta_kubernetes_pod_name, __meta_kubernetes_pod_container_port_name]
        separator: ":"
        target_label: instance

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: node
    kubernetes_sd_configs:
      - role: pod
        namespaces:
          names: [cec]
    relabel_configs:
      - source_labels: [__meta_kubernetes_pod_label_app]
        regex: node-exporter
        action: keep
      - source_labels: [__meta_kubernetes_pod_node_name]
        target_label: instance
