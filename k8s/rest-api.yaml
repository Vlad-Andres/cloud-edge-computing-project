apiVersion: v1
kind: Service
metadata:
  name: rest-api
  labels:
    app: rest-api
spec:
  selector:
    app: rest-api
  # kube-proxy accepts traffic for these node IPs on port 3003 and balances it
  # over the replicas, wherever they run. They are the private IPs AWS maps
  # the public ones to. NodePort can't use 3003.
  externalIPs:
    - 10.0.1.151 # control plane (group16), public 52.209.7.51
    - 10.0.1.230 # worker, public 18.203.181.249
  ports:
    - name: http
      port: 3003
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rest-api
  labels:
    app: rest-api
spec:
  # No replicas field: the HPA (rest-api-hpa.yaml) scales between 2 and 8 pods
  # on CPU. A value here would reset the count on every kubectl apply.
  selector:
    matchLabels:
      app: rest-api
  template:
    metadata:
      labels:
        app: rest-api
    spec:
      enableServiceLinks: false
      # Spread over the nodes when possible, but still schedule extra replicas
      # when a node is down or full
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          # Count only pods of the current version, not old ones still shutting down
          matchLabelKeys: [pod-template-hash]
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: rest-api
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: rest-api
          image: rest-api
          envFrom:
            - secretRef:
                name: app-env
          env:
            - name: POSTGRES_HOST
              value: postgres
            - name: POSTGRES_PORT
              value: "5432"
          ports:
            - name: http
              containerPort: 3003
          # The HPA's CPU target is a percentage of this request. No CPU limit,
          # it would only throttle. Starting values, tune from Grafana.
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
