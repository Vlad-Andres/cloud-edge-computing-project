# Scales the REST API on CPU (needs metrics-server, see README).
# Utilization is measured against the pods' CPU request (200m).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: rest-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: rest-api
  minReplicas: 2
  # The nodes have 2 GB RAM; each pod holds up to 8 Postgres connections
  # (4 workers x pool of 2), Postgres allows 100
  maxReplicas: 4
  behavior:
    scaleUp:
      # One pod per 30 s, so a burst doesn't fill the small nodes at once
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          # Scale before requests start queueing
          averageUtilization: 60
