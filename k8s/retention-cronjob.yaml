# Replaces the host crontab + scripts/cleanup-retention.sh of the docker setup
apiVersion: batch/v1
kind: CronJob
metadata:
  name: retention
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: OnFailure
          enableServiceLinks: false
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          containers:
            - name: retention
              image: postgres:16-alpine
              envFrom:
                - secretRef:
                    name: app-env
              env:
                - name: PGHOST
                  value: postgres
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: app-env
                      key: POSTGRES_PASSWORD
              command: ["sh", "-c"]
              args:
                - |
                  set -eu
                  psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
                    -c "DELETE FROM measurements
                        WHERE timestamp < extract(epoch FROM now() - interval '1 days');"
                  psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -v ON_ERROR_STOP=1 \
                    -c "VACUUM (ANALYZE) measurements;"
