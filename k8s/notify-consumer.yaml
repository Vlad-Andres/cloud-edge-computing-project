apiVersion: apps/v1
kind: Deployment
metadata:
  name: notify-consumer
  labels:
    app: notify-consumer
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: notify-consumer
  template:
    metadata:
      labels:
        app: notify-consumer
    spec:
      enableServiceLinks: false
      shareProcessNamespace: true
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          matchLabelKeys: [pod-template-hash]
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: notify-consumer
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: notify-consumer
          image: notify-consumer

          args: ["experiment", "group16-k8s-notify"]
          envFrom:
            - secretRef:
                name: app-env
          ports:
            - name: metrics
              containerPort: 9091
          volumeMounts:
            - name: kafka-auth
              mountPath: /usr/src/app/auth
              readOnly: true
      volumes:
        - name: kafka-auth
          secret:
            secretName: kafka-auth
