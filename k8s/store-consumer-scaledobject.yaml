apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: store-consumer
spec:
  scaleTargetRef:
    name: store-consumer
  minReplicaCount: 1
  #all pods write into the same Postgres on group16
  maxReplicaCount: 3
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.cec.svc:9090
        query: |
          sum(clamp_min(
            max by (partition) (kafka_partition_high_watermark{job="store-consumer"})
            - max by (partition) (kafka_partition_consumed_offset{job="store-consumer"}), 0))
        # Target lag per pod: pods = ceil(lag / 3000)
        threshold: "3000"
