# Scales store-consumer on Kafka lag (needs KEDA, see README). KEDA creates
# and drives the HPA for it, so there is no separate HPA.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: store-consumer
spec:
  scaleTargetRef:
    name: store-consumer
  minReplicaCount: 2
  # = partitions of the topic; more pods would sit idle
  maxReplicaCount: 16
  pollingInterval: 10
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          # Every change in pod count is a Kafka rebalance
          stabilizationWindowSeconds: 120
  # If Prometheus can't be queried 3 times in a row, hold 4 pods
  fallback:
    failureThreshold: 3
    replicas: 4
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.cec.svc:9090
        # Same query as the dashboard's "Backlog (lag)" panel
        query: |
          sum(clamp_min(
            max by (partition) (kafka_partition_high_watermark{job="store-consumer"})
            - max by (partition) (kafka_partition_consumed_offset{job="store-consumer"}), 0))
        # Target lag per pod: pods = ceil(lag / threshold)
        threshold: "500"
